[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specset"
version = "0.9.2"
description = "Toolkit for manipulation of peptide-spectrum matches in mass spectrometry-based proteomics"
authors = [
    { name = "Thang Pham", email = "tp210901@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["pandas", "lxml", "pyteomics", "pyarrow"]

[project.optional-dependencies]
full = ["PySide6", "psm_utils"]

[project.scripts]
specset = "specset.cli:main"
specset-gui = "specset.gui:main"

[tool.setuptools.packages.find]
include = ["specset*"]

[tool.setuptools.package-data]
specset = ["unimod.xml", "favicon.ico"]

[project.urls]
Homepage = "https://github.com/tvpham/specset"
Repository = "https://github.com/tvpham/specset.git"